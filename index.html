<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тренажер завдань</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sheet">

    <!-- Екран 1: список завдань -->
    <section id="list-screen">
      <h1>Тренажер завдань</h1>
      <p class="muted">Обери набір завдань і відповідай на питання по черзі.</p>
      <div id="tasks" class="tasks">Завантаження…</div>
    </section>

    <!-- Екран 2: питання -->
    <section id="quiz-screen" hidden>
      <div class="quiz-top">
        <button id="back-btn" class="btn btn-ghost" type="button">← До списку</button>
        <span id="progress-text" class="muted"></span>
      </div>
      <div class="progress"><div id="progress-bar" class="progress-fill"></div></div>

      <h2 id="question-text" class="question"></h2>
      <div id="question-body"></div>

      <div id="feedback" class="feedback" role="status" hidden></div>

      <div class="actions">
        <button id="check-btn" class="btn" type="button" hidden disabled>Перевірити</button>
        <button id="next-btn" class="btn" type="button" hidden>Далі</button>
      </div>
    </section>

    <!-- Екран 3: результат -->
    <section id="result-screen" hidden>
      <h1 id="result-title">Результат</h1>
      <p id="result-score" class="score"></p>
      <p id="result-text" class="muted"></p>
      <div class="actions">
        <button id="retry-btn" class="btn" type="button">Пройти ще раз</button>
        <button id="menu-btn" class="btn btn-ghost" type="button">До списку</button>
      </div>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
